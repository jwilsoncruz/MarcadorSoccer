<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Marcador de Fútbol — Panel y Pantalla OBS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}
:root{--bg:#12161d;--bg2:#1a2029;--bg3:#232b37;--line:#313b4a;--tx:#e8edf4;--mut:#93a0b3;--acc:#f2b632;--ok:#2e9d5b;--bad:#d04545;--info:#3a7bd5}
body{margin:0;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:14px}
/* ===== PANEL ===== */
header.top{display:flex;gap:6px;align-items:center;padding:10px 14px;background:var(--bg2);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header.top h1{font-size:15px;margin:0 16px 0 0;font-weight:700}
.tab{background:transparent;border:1px solid transparent;color:var(--mut);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600}
.tab:hover{color:var(--tx)}
.tab.on{background:var(--bg3);color:var(--acc);border-color:var(--line)}
main{padding:14px;max-width:1500px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(440px,1fr));gap:14px;align-items:start}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:14px}
.card h3{margin:0 0 10px;font-size:14px;color:var(--acc);font-weight:700}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
.row label{color:var(--mut);font-size:12px}
button{font:inherit;cursor:pointer;background:var(--bg3);color:var(--tx);border:1px solid var(--line);border-radius:7px;padding:7px 11px;font-weight:600}
button:hover{border-color:#51607a}
button.on{background:var(--acc);color:#1b1500;border-color:var(--acc)}
button.g{background:var(--ok);border-color:var(--ok)}
button.r{background:var(--bad);border-color:var(--bad)}
button.y{background:#e5c100;color:#201a00;border-color:#e5c100}
button.b{background:var(--info);border-color:var(--info)}
button.big{padding:12px 20px;font-size:17px}
button.sm{padding:3px 8px;font-size:12px}
input,select,textarea{font:inherit;background:#0e1218;color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
input[type=color]{padding:0;width:42px;height:34px;cursor:pointer}
input[type=checkbox]{width:18px;height:18px}
input[type=file]{max-width:210px;font-size:12px}
input.w{width:100%}
.scorebox{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.tm{padding:10px;border-radius:8px;text-align:center;font-weight:800;font-size:18px}
.big{font-size:44px;font-weight:800;line-height:1}
.sc{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:8px}
.sc span{font-size:46px;font-weight:800;min-width:56px;text-align:center}
.clkbig{font-size:54px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;line-height:1}
.mid{text-align:center}
.mut{color:var(--mut);font-size:12px}
.log{max-height:300px;overflow:auto}
.ev{display:flex;gap:8px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line)}
.ev b{min-width:48px;color:var(--acc)}
.ev span{flex:1}
table.pl{width:100%;border-collapse:collapse}
table.pl td{padding:2px 3px}
table.pl input{width:100%;padding:5px 6px}
table.pl input.n{width:46px;text-align:center}
table.pl input.p{width:62px}
.prev{position:relative;width:480px;height:270px;overflow:hidden;border:1px solid var(--line);border-radius:8px;background:repeating-conic-gradient(#2a303a 0 25%,#1f242c 0 50%) 0 0/24px 24px;max-width:100%}
.prev iframe{width:1920px;height:1080px;border:0;transform:scale(.25);transform-origin:0 0;pointer-events:none}
.help{color:var(--mut);font-size:13px;line-height:1.55}
.help b{color:var(--tx)}
.pk{display:inline-flex;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);align-items:center;justify-content:center;font-weight:800;margin-right:5px}
.pk.g{background:var(--ok);border-color:var(--ok)}
.pk.m{background:var(--bad);border-color:var(--bad)}
.pk.s{background:var(--info);border-color:var(--info)}
.teamhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.logoprev{width:64px;height:64px;object-fit:contain;background:#0e1218;border:1px solid var(--line);border-radius:8px}

/* ===== PANTALLA (OBS) ===== */
body.disp{background:transparent;overflow:hidden}
body.verde{background:#00b140}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;font-family:'Bahnschrift','Segoe UI Semibold','Segoe UI',Roboto,Arial,sans-serif;color:#fff}
#bugwrap{position:absolute}
.bug{display:grid;grid-template-columns:auto 210px auto;filter:drop-shadow(0 6px 14px rgba(0,0,0,.45))}
.bside{display:flex;align-items:stretch;height:70px}
.bside .lg{width:78px;background:#0a0d12;display:flex;align-items:center;justify-content:center}
.bside .nm{background:var(--tc);color:var(--tc2);min-width:150px;padding:0 20px;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:800;letter-spacing:1px}
.bside .gl{width:76px;background:#0a0d12;display:flex;align-items:center;justify-content:center;font-size:50px;font-weight:800;font-variant-numeric:tabular-nums}
.bclk{background:#f4f4f0;color:#0a0d12;display:flex;flex-direction:column;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;line-height:1}
.bclk #clk{font-size:40px;font-weight:800}
.bclk #clk.lbl{font-size:24px}
.bclk #ov{font-size:18px;font-weight:800;color:#c4181f;height:0;overflow:visible}
.brow{display:flex;align-items:flex-start;height:30px}
.brow.m{justify-content:center}
.brow .mid2{background:#0a0d12;padding:0 16px;font-size:18px;font-weight:700;display:flex;gap:12px;align-items:center;height:30px;letter-spacing:1px;white-space:nowrap}
.brow .add{color:#ffd23f;font-weight:800}
.rc{display:inline-block;width:16px;height:22px;background:#e0141e;margin:4px 4px 0;border-radius:2px;box-shadow:0 2px 4px rgba(0,0,0,.4)}
.ph{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800}
.scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(6,9,14,.62);animation:fade .45s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(90px);opacity:0}to{transform:none;opacity:1}}
@keyframes dn{from{transform:none;opacity:1}to{transform:translateY(90px);opacity:0}}
.lu{width:960px;background:#0d1118;border-top:12px solid var(--c1);box-shadow:0 30px 80px rgba(0,0,0,.6)}
.lu.two{width:880px}
.lu .lh{display:flex;align-items:center;gap:24px;padding:20px 30px;background:var(--c1);color:var(--c2)}
.lu .lh h1{margin:0;font-size:56px;line-height:1}
.lu .lh h3{margin:6px 0 0;font-size:24px;font-weight:600;opacity:.9}
.lu .cols{display:grid;grid-template-columns:1.25fr 1fr;gap:26px;padding:22px 30px 26px}
.lu.two .cols{grid-template-columns:1fr;gap:10px}
.lu h4{margin:0 0 8px;font-size:20px;letter-spacing:2px;color:#9fb0c7}
.pr{display:flex;align-items:center;gap:14px;font-size:30px;padding:3px 0;border-bottom:1px solid #1f2733}
.pr b{width:50px;height:38px;background:var(--c1);color:var(--c2);display:flex;align-items:center;justify-content:center;font-size:26px;border-radius:4px}
.pr span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr i{font-style:normal;color:#8fa0b8;font-size:20px}
.pr em{font-style:normal;font-size:22px;min-width:60px;text-align:right}
.pr.off span{opacity:.6}
.lu.two .pr{font-size:25px}
.lu.two .pr b{height:32px;width:44px;font-size:22px}
.intro{position:absolute;inset:0;animation:fade .5s ease}
.intro .half{position:absolute;top:0;bottom:0;width:50%}
.intro .a{left:0}.intro .b{right:0}
.intro .ic{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:90px;padding-bottom:120px}
.intro .tn{width:560px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:18px}
.intro h2{margin:0;font-size:78px;line-height:1;text-shadow:0 4px 18px rgba(0,0,0,.6)}
.intro .vs{font-size:90px;font-weight:800;background:#fff;color:#0a0d12;width:150px;height:150px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.intro .info{position:absolute;left:0;right:0;bottom:90px;text-align:center;font-size:38px;line-height:1.5;text-shadow:0 3px 12px rgba(0,0,0,.7)}
.intro .info small{font-size:30px;opacity:.9}
.panelx{width:1000px;background:#0d1118;border-top:12px solid #f2b632;padding:30px 44px 36px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.panelx h1{margin:0 0 20px;font-size:50px}
.panelx .rr{display:flex;justify-content:space-between;font-size:36px;padding:12px 0;border-bottom:1px solid #222c3a}
.panelx .rr span{color:#9fb0c7;font-size:28px}
.sumhead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;margin-bottom:20px}
.sumhead .t{display:flex;align-items:center;gap:18px;font-size:46px;font-weight:800}
.sumhead .t.r{flex-direction:row-reverse}
.sumhead .res{font-size:96px;font-weight:800;font-variant-numeric:tabular-nums}
.sumcols{display:grid;grid-template-columns:1fr 1fr;gap:34px;font-size:28px}
.sumcols div.g{padding:4px 0;border-bottom:1px solid #1f2733}
.sumcols .right{text-align:right}
.penrow{display:flex;align-items:center;gap:22px;margin:16px 0}
.penrow .t{width:340px;display:flex;align-items:center;gap:14px;font-size:40px;font-weight:800}
.penrow .k{display:flex;gap:10px;flex:1}
.dpk{width:62px;height:62px;border-radius:50%;border:4px solid #3b4659;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800}
.dpk.g{background:#22a55a;border-color:#22a55a}
.dpk.m{background:#d93a3a;border-color:#d93a3a}
.dpk.s{background:#3a7bd5;border-color:#3a7bd5}
.penrow .tot{font-size:70px;font-weight:800;width:90px;text-align:right}
.winner{margin-top:14px;text-align:center;font-size:44px;font-weight:800;color:#ffd23f}
.fl{position:absolute;left:50%;bottom:170px;width:1150px;margin-left:-575px;animation:up .55s cubic-bezier(.2,.8,.2,1);box-shadow:0 20px 60px rgba(0,0,0,.55)}
.fl.out{animation:dn .5s forwards}
.fl .ft{background:var(--c1);color:var(--c2);font-size:62px;font-weight:800;padding:8px 34px;letter-spacing:2px}
.fl .fb{background:#0d1118;display:flex;align-items:center;gap:26px;padding:20px 34px}
.fl .l1{font-size:56px;font-weight:800;line-height:1.05}
.fl .l2{font-size:32px;color:#b8c5d8;margin-top:6px}
.brk{position:absolute;left:50%;bottom:48px;transform:translateX(-50%);background:#0d1118;border-left:14px solid #38b6ff;padding:12px 34px;display:flex;gap:30px;align-items:center;font-size:40px;font-weight:800;box-shadow:0 14px 40px rgba(0,0,0,.5);animation:up .5s ease;white-space:nowrap}
.brk #bt{font-size:60px;font-variant-numeric:tabular-nums;color:#ffd23f;min-width:150px;text-align:right}
.tick{position:absolute;left:0;right:0;bottom:0;height:54px;background:#0d1118;border-top:4px solid #f2b632;overflow:hidden;display:flex;align-items:center}
.tick span{display:inline-block;white-space:nowrap;font-size:30px;padding-left:100%;animation:mq 28s linear infinite}
@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-100%)}}
.imgf{display:flex;gap:10px;align-items:center;margin:6px 0 10px}
.fph{width:130px;height:130px;object-fit:cover;border-radius:50%;border:5px solid var(--c1)}
.spgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.spc{background:#fff;border-radius:10px;height:190px;display:flex;align-items:center;justify-content:center;padding:18px}
.spc img{max-width:100%;max-height:100%;object-fit:contain}
#spons{position:absolute}
.sp1{width:300px;height:150px;background:rgba(255,255,255,.96);border-radius:10px;display:flex;align-items:center;justify-content:center;padding:14px;animation:fade .6s ease;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.sp1 img{max-width:100%;max-height:100%;object-fit:contain}
.stl{text-align:center;font-size:26px;color:#b8c5d8;margin-top:14px}
.strow{display:grid;grid-template-columns:100px 1fr 100px;align-items:center;gap:16px;margin:4px 0}
.strow b{font-size:38px;font-variant-numeric:tabular-nums}
.strow b:last-child{text-align:right}
.stbar{display:flex;height:22px;background:#1b2330;border-radius:11px;overflow:hidden;gap:3px}
.stbar i{display:block;height:100%}
.intro.hasbg .half{opacity:.86}

@keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes pop{0%{transform:scale(1)}30%{transform:scale(1.8);color:#ffd23f}60%{transform:scale(.92)}100%{transform:scale(1)}}
@keyframes glow{0%,100%{filter:none}20%{filter:brightness(1.9) saturate(1.5)}}
@keyframes pop2{0%{transform:scale(0) rotate(-180deg);opacity:0}70%{transform:scale(1.15) rotate(8deg);opacity:1}100%{transform:none;opacity:1}}
@keyframes rowin{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
@keyframes lhin{from{opacity:0;transform:translateY(-30px)}to{opacity:1;transform:none}}
@keyframes luin{from{opacity:0;transform:translateY(60px) scale(.96)}to{opacity:1;transform:none}}
@keyframes flIn{0%{transform:translateX(-140px) scale(.92);opacity:0}60%{transform:translateX(14px) scale(1.02);opacity:1}100%{transform:none}}
@keyframes flGoal{0%{transform:scale(.3);opacity:0}55%{transform:scale(1.09);opacity:1}75%{transform:scale(.97)}100%{transform:scale(1)}}
@keyframes shine{to{left:115%}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes burst{0%{opacity:0}15%{opacity:.85}100%{opacity:0}}
@keyframes vig{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
@keyframes wipeL{from{transform:translateX(-100%)}to{transform:none}}
@keyframes wipeR{from{transform:translateX(100%)}to{transform:none}}
@keyframes fromL{from{opacity:0;transform:translateX(-320px)}to{opacity:1;transform:none}}
@keyframes fromR{from{opacity:0;transform:translateX(320px)}to{opacity:1;transform:none}}
@keyframes upin{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.bw.enter{animation:wipe .9s cubic-bezier(.2,.8,.2,1)}
.gl.pop{animation:pop 1s ease}
.nm.glow{animation:glow 1.6s ease}
.fl{transform-origin:50% 100%;animation:flIn .7s cubic-bezier(.2,.9,.2,1)}
.fl.goal:not(.out){animation:flGoal .9s cubic-bezier(.2,.9,.2,1)}
.fl.goal .ft{position:relative;overflow:hidden}
.fl.goal .ft::after{content:'';position:absolute;top:0;bottom:0;width:200px;left:-260px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);animation:shine 1.3s .55s ease-in-out 2}
.fl.card:not(.out) .fb{animation:shake .55s .35s}
.fl .fb>:first-child{animation:pop2 .7s .35s both}
.fl.out{animation:dn .5s forwards}
#burst{position:absolute;inset:0;pointer-events:none;opacity:0}
#burst.bg{background:radial-gradient(circle at 50% 75%,var(--bc) 0,transparent 68%);animation:burst 1.7s ease-out}
#burst.br{box-shadow:inset 0 0 260px 70px rgba(224,20,30,.9);animation:vig 1.9s ease-out}
#burst.by{box-shadow:inset 0 0 240px 60px rgba(255,210,63,.85);animation:vig 1.5s ease-out}
.pr{animation:rowin .5s both}
.lu{animation:luin .65s cubic-bezier(.2,.8,.2,1)}
.lu .lh{animation:lhin .6s ease both}
.intro .half.a{animation:wipeL .9s cubic-bezier(.2,.8,.2,1) both}
.intro .half.b{animation:wipeR .9s cubic-bezier(.2,.8,.2,1) both}
.intro .tn:first-child{animation:fromL 1s .3s cubic-bezier(.2,.9,.2,1) both}
.intro .tn:last-child{animation:fromR 1s .3s cubic-bezier(.2,.9,.2,1) both}
.intro .vs{animation:pop2 .7s .9s both}
.intro .info{animation:upin .8s 1.1s both}
.stbar i{animation:grow .9s both;transform-origin:left}
.dpk.new{animation:pop2 .5s both}

header.top{align-items:center}
.grps{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.grp{background:var(--bg3);border:1px solid var(--line);color:var(--mut);padding:8px 14px;border-radius:8px;font-weight:700;display:flex;gap:8px;align-items:center;font-size:14px}
.grp:hover{color:var(--tx)}
.grp.on{background:var(--acc);color:#1b1500;border-color:var(--acc)}
.grp.alt{margin-left:auto}
.num{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.14);display:inline-flex;align-items:center;justify-content:center;font-size:12px}
.grp.on .num{background:rgba(0,0,0,.2)}
nav.sub{display:flex;gap:6px;align-items:center;flex-wrap:wrap;width:100%;padding-top:6px;border-top:1px solid var(--line)}
nav.sub .hint{margin-left:auto;color:var(--mut);font-size:13px;max-width:680px;text-align:right}
button.next{outline:2px solid var(--acc);outline-offset:1px}
.steps .ev b{width:28px;min-width:28px;height:28px;border-radius:50%;background:var(--bg3);color:var(--acc);display:flex;align-items:center;justify-content:center}
#pv{position:fixed;z-index:30;background:var(--bg2);border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 44px rgba(0,0,0,.6);overflow:hidden}
#pvh{display:flex;align-items:center;gap:4px;padding:5px 8px;background:var(--bg3);cursor:move;font-size:12px;user-select:none;-webkit-user-select:none;touch-action:none}
#pvh .sp{flex:1}
#pvh button{padding:1px 8px;min-width:26px}
#pvv{position:relative;overflow:hidden}
#pv[data-bg="0"] #pvv{background:repeating-conic-gradient(#2a303a 0 25%,#1f242c 0 50%) 0 0/24px 24px}
#pv[data-bg="1"] #pvv{background:#00b140}
#pv[data-bg="2"] #pvv{background:linear-gradient(#3f9446,#2a6b30)}
#pvf{width:1920px;height:1080px;border:0;transform-origin:0 0;pointer-events:none;background:transparent;position:absolute;left:0;top:0}
#pv.min #pvv{display:none}
#bigscr{position:relative;width:100%;max-width:1100px;aspect-ratio:16/9;overflow:hidden;border:1px solid var(--line);border-radius:8px;background:#000}
#bigscr[data-bg="0"]{background:repeating-conic-gradient(#2a303a 0 25%,#1f242c 0 50%) 0 0/24px 24px}
#bigscr[data-bg="1"]{background:#00b140}
#bigscr[data-bg="2"]{background:linear-gradient(#3f9446,#2a6b30)}
#bigscr:fullscreen{max-width:none;width:100vw;height:100vh;aspect-ratio:auto;border:0;border-radius:0}
#bigf{position:absolute;width:1920px;height:1080px;border:0;transform-origin:0 0;pointer-events:none;background:transparent}
kbd{font:11px monospace;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.25);border-radius:4px;padding:0 5px;margin-left:4px}
.cdbox{position:absolute;left:0;right:0;bottom:90px;text-align:center;text-shadow:0 4px 18px rgba(0,0,0,.7)}
.cdbox .t1{font-size:44px;letter-spacing:8px;font-weight:700;line-height:1.3}
#cdt{font-size:200px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;display:inline-block}
#cdt.pulse{animation:beat 1s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.brow3{display:flex;width:0;min-width:100%;gap:6px}
.brow3.r{justify-content:flex-end}
.gc{background:#0a0d12;margin-top:5px;padding:4px 12px;font-size:20px;font-weight:700;white-space:nowrap;border-left:4px solid var(--gc,#fff)}
.brow3.r .gc{border-left:0;border-right:4px solid var(--gc,#fff)}
.gc.new{animation:gcin .7s cubic-bezier(.2,.9,.2,1)}
@keyframes gcin{from{opacity:0;transform:translateY(-24px)}to{opacity:1;transform:none}}
.lu.pt{width:1700px}
.pbody{display:flex;gap:26px;padding:22px 30px 26px}
.pbody svg{flex:none}
.bench{flex:1;min-width:0}
.bench .pr{font-size:26px}
.pp{animation:ppin .55s both;transform-box:fill-box;transform-origin:center}
.pp.off>*{opacity:.45}
@keyframes ppin{from{opacity:0;transform:scale(0)}to{opacity:1;transform:none}}
button.dis{opacity:.35;filter:grayscale(.6)}
.toast.ok{background:#16452a;border-color:#2e9d5b;color:#d8ffe6}

<body>
<div id="app"></div>
<script id="mainjs">
/* =========================================================
   MARCADOR DE FÚTBOL — un solo archivo, dos modos:
   - Panel de control (abrir normal)
   - Pantalla para OBS (abrir con #pantalla al final de la dirección)
   ========================================================= */
const KEY='mfutbol_v1', RKEY='mfutbol_rev';
const DISP=!!window.__DISP||/^#(pantalla|verde)/.test(location.hash);
addEventListener('hashchange',()=>location.reload());

const P=[
 {k:'pre',l:'PREVIA',n:'Previa'},
 {k:'1t',l:'1T',s:0,e:45,n:'Primer tiempo'},
 {k:'ht',l:'ENTRETIEMPO',n:'Entretiempo'},
 {k:'2t',l:'2T',s:45,e:90,n:'Segundo tiempo'},
 {k:'f90',l:"FIN 90'",n:'Fin de los 90'},
 {k:'et1',l:'ET 1',s:90,e:105,n:'Tiempo extra 1'},
 {k:'etb',l:'DESC. ET',n:'Descanso extra'},
 {k:'et2',l:'ET 2',s:105,e:120,n:'Tiempo extra 2'},
 {k:'pen',l:'PENALES',n:'Penales'},
 {k:'end',l:'FINAL',n:'Final'}
];
const mkPlayers=()=>Array.from({length:18},(_,i)=>({n:String(i+1),name:'',pos:'',st:i<11,foto:''}));
const defTeam=(name,short,c1,c2)=>({name,short,c1,c2,logo:'',dt:'',form:'4-4-2',players:mkPlayers()});
const def=()=>({
 rev:0,
 match:{torneo:'Campeonato',fase:'',estadio:'',fecha:'',hora:'',logo:'',bg:''},
 sp:{on:false,sec:6,pos:'br',items:Array.from({length:8},()=>({name:'',img:''}))},
 stats:{pos:50,A:{tiros:0,arco:0,esq:0,faltas:0,fj:0,ata:0},B:{tiros:0,arco:0,esq:0,faltas:0,fj:0,ata:0}},
 refs:{central:'',a1:'',a2:'',cuarto:'',var:''},
 A:defTeam('Equipo A','EQA','#d32f2f','#ffffff'),
 B:defTeam('Equipo B','EQB','#1565c0','#ffffff'),
 adj:{A:0,B:0},
 clock:{period:0,running:false,base:0,t0:0,added:0},
 brk:{on:false,label:'PAUSA DE HIDRATACIÓN',dur:180000,base:0,t0:0,running:false},
 events:[],
 pens:{on:false,first:'A',A:[],B:[]},
 scene:'',bug:true,
 ticker:{on:false,text:''},
 cust:{t:'',l1:'',l2:''},
 flash:null,auto:true,fx:true,sShow:0,cd:{min:5,dur:300000,base:0,t0:0,running:false,auto:false,fired:false},
 ui:{pos:'tl',scale:100,scorers:true,safe:true,theme:'ucl',scorerMode:'timed',scorerSecs:12}
});
function merge(d,s){for(const k in s){if(s[k]&&typeof s[k]==='object'&&!Array.isArray(s[k])&&d[k]&&typeof d[k]==='object'&&!Array.isArray(d[k]))merge(d[k],s[k]);else d[k]=s[k];}return d;}
function load(){try{const r=JSON.parse(localStorage.getItem(KEY));return r?merge(def(),r):def();}catch(e){return def();}}
let S=load();
let bc=null;try{bc=new BroadcastChannel('mfutbol');}catch(e){}
function commit(){
 S.rev=(S.rev||0)+1;
 try{localStorage.setItem(KEY,JSON.stringify(S));localStorage.setItem(RKEY,S.rev+':'+Date.now());}
 catch(e){if(!window.__warned){window.__warned=1;alert('No se pudo guardar en el navegador (¿escudo muy pesado o archivo abierto desde una vista previa?). El marcador seguirá funcionando, pero no se recordará al cerrar.');}}
 if(bc)try{bc.postMessage(1);}catch(e){}
 if(!DISP)pvPost();
}
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const other=t=>t==='A'?'B':'A';
const pad=n=>String(n).padStart(2,'0');
const fmt=(ms,ceil)=>{const s=ceil?Math.ceil(ms/1000):Math.floor(ms/1000);return pad(Math.floor(s/60))+':'+pad(s%60);};

/* ---------- Reloj ---------- */
function elapsed(){const c=S.clock;return c.base+(c.running?Date.now()-c.t0:0);}
function clockInfo(){
 const p=P[S.clock.period];
 if(p.s===undefined)return{has:false,txt:p.l,over:''};
 const total=p.s*60000+elapsed(),end=p.e*60000;
 if(total>end)return{has:true,txt:fmt(end),over:'+'+fmt(total-end)};
 return{has:true,txt:fmt(total),over:''};
}
function minLabel(){
 let i=S.clock.period;const p=P[i];
 if(p.s===undefined){ // en descansos: usa el final del último periodo con reloj
  while(i>0&&P[i].s===undefined)i--;
  const q=P[i];return q.e?q.e+"'":"0'";
 }
 const total=p.s*60000+elapsed(),end=p.e*60000;
 if(total>end)return p.e+'+'+(Math.floor((total-end)/60000)+1)+"'";
 return (Math.floor(total/60000)+1)+"'";
}
function brkRem(){const b=S.brk;const el=b.base+(b.running?Date.now()-b.t0:0);return Math.max(0,b.dur-el);}

/* ---------- Datos derivados de los eventos ---------- */
function pname(t,i,free){const p=S[t].players[i];return (i>=0&&p)?(p.name.trim()||('#'+p.n)):(free||'');}
function derive(){
 const sc={A:S.adj.A,B:S.adj.B},red={A:0,B:0},yel={A:0,B:0},ps={A:{},B:{}},goals={A:[],B:[]};
 const g=(t,i)=>ps[t][i]||(ps[t][i]={g:0,y:0,r:false,out:false,in:false});
 for(const e of S.events){
  const t=e.team;
  if(e.type==='goal'){
   const st=e.own?other(t):t;sc[st]++;
   goals[st].push({name:pname(t,e.pi,e.free),min:e.min,own:e.own,pen:e.pen,id:e.id});
   if(e.pi>=0&&!e.own)g(t,e.pi).g++;
  }else if(e.type==='yellow'){
   yel[t]++;if(e.pi>=0){const p=g(t,e.pi);p.y++;if(p.y>=2){p.r=true;red[t]++;}}
  }else if(e.type==='red'){
   red[t]++;if(e.pi>=0)g(t,e.pi).r=true;
  }else if(e.type==='sub'){
   if(e.pi>=0)g(t,e.pi).out=true;if(e.pi2>=0)g(t,e.pi2).in=true;
  }
 }
 return{sc,red,yel,ps,goals};
}
const pcount=a=>a.filter(x=>x==='g').length;
function penWin(){
 const a=S.pens.A,b=S.pens.B,ga=pcount(a),gb=pcount(b),ra=Math.max(0,5-a.length),rb=Math.max(0,5-b.length);
 if(a.length<=5&&b.length<=5){if(ga>gb+rb)return'A';if(gb>ga+ra)return'B';return null;}
 if(a.length===b.length&&ga!==gb)return ga>gb?'A':'B';
 return null;
}
const lg=(t,sz)=>{const T=S[t];return T.logo?`<img src="${T.logo}" style="width:${sz}px;height:${sz}px;object-fit:contain">`:`<div class="ph" style="width:${sz}px;height:${sz}px;font-size:${Math.round(sz*.34)}px;background:${T.c1};color:${T.c2}">${esc((T.short||T.name).slice(0,3))}</div>`;};

/* ---------- Banners ---------- */
function flash(type,team,title,l1,l2,dur){S.flash={id:Date.now(),type,team,title,l1,l2,dur:dur||7000,ts:Date.now()};}
function autoFlash(e,prevYellows){
 const t=e.team,T=S[t],n1=pname(t,e.pi,e.free),n2=pname(t,e.pi2,'');
 if(e.type==='goal'){
  const st=e.own?other(t):t;
  flash('goal',st,e.own?'AUTOGOL':(e.pen?'¡GOL DE PENAL!':'¡GOOOL!'),n1,S[st].name+'  ·  '+e.min);
 }else if(e.type==='yellow'){
  flash('card',t,prevYellows>=1&&e.pi>=0?'SEGUNDA AMARILLA · EXPULSADO':'TARJETA AMARILLA','🟨 '+n1,T.name+'  ·  '+e.min);
 }else if(e.type==='red'){
  flash('card',t,'TARJETA ROJA','🟥 '+n1,T.name+'  ·  '+e.min);
 }else if(e.type==='sub'){
  flash('sub',t,'CAMBIO · '+T.name,'🔺 '+n2,'🔻 Sale: '+n1+'  ·  '+e.min);
 }
}

/* =========================================================
   PANTALLA PARA OBS
   ========================================================= */
let lastVis='',lastSceneKey=null,lastR=null,lastFlash=0,flashTimer=null,lastSc=null,bugEnter=false,fxRaf=0;const SIG={},POP={A:false,B:false};
function setHTML(id,sig,html){const el=document.getElementById(id);if(SIG[id]!==sig){SIG[id]=sig;el.innerHTML=html;}}

function bugHTML(d){
 const A=S.A,B=S.B;
 const side=(t,T,rev)=>{
  const lgx=`<div class="lg">${lg(t,56)}</div>`;
  const nm=`<div class="nm${POP[t]?' glow':''}" style="--tc:${T.c1};--tc2:${T.c2}">${esc(T.short||T.name)}</div>`;
  const gl=`<div class="gl${POP[t]?' pop':''}">${d.sc[t]}</div>`;
  return `<div class="bside">${rev?gl+nm+lgx:lgx+nm+gl}</div>`;
 };
 const reds=n=>Array.from({length:n},()=>'<span class="rc"></span>').join('');
 const ci=clockInfo(),p=P[S.clock.period];
 const tl=S.match.logo?`<div style="width:84px;height:70px;background:#0a0d12;display:flex;align-items:center;justify-content:center;margin-right:4px"><img src="${esc(S.match.logo)}" style="max-width:66px;max-height:58px;object-fit:contain"></div>`:'';
 const gc=t=>{
  const mode=scMode();if(mode==='off')return '';
  const all=d.goals[t];let list=all.map((x,i)=>({x,i}));
  if(mode==='timed'){const ms=(+S.ui.scorerSecs||12)*1000,now=Date.now(),man=(S.sShow||0)>now;list=list.filter(o=>man||now-o.x.id<ms);}
  list=list.slice(-3);
  return list.map(o=>`<span class="gc${(POP[t]&&o.i===all.length-1)?' new':''}">⚽ ${esc(shortN(o.x.name)||'Gol')}${o.x.own?' (a.g.)':''}${o.x.pen?' (p)':''} ${esc(o.x.min)}</span>`).join('');
 };
 let mid=`<span>${esc(p.l)}</span>`;
 if(ci.has&&S.clock.added>0)mid+=`<span class="add">+${S.clock.added}'</span>`;
 if(S.pens.on)mid=`<span>PENALES</span><span class="add">${pcount(S.pens.A)} - ${pcount(S.pens.B)}</span>`;
 if(!ci.has&&!S.pens.on)mid=`<span>${esc(S.match.torneo||'')}</span>`;
 return `<div class="bw${bugEnter?' enter':''}" style="display:flex;align-items:flex-start">${tl}<div class="bug">
  ${side('A',A,false)}
  <div class="bclk"><div id="clk" class="${ci.has?'':'lbl'}">${esc(ci.txt)}</div><div id="ov">${esc(ci.over)}</div></div>
  ${side('B',B,true)}
  <div class="brow">${reds(d.red.A)}</div>
  <div class="brow m"><div class="mid2">${mid}</div></div>
  <div class="brow" style="justify-content:flex-end">${reds(d.red.B)}</div>
  <div class="brow3" style="--gc:${A.c1}">${gc('A')}</div><div></div><div class="brow3 r" style="--gc:${B.c1}">${gc('B')}</div>
 </div></div>`;
}
function lineupHTML(t,two,d){
 const T=S[t];
 const all=T.players.map((p,i)=>({...p,i}));
 let list=all.filter(p=>p.name.trim());if(!list.length)list=all.slice(0,18);
 let k=0;const row=p=>{const s=d.ps[t][p.i]||{};
  return `<div class="pr${s.out?' off':''}" style="animation-delay:${300+(k++)*55}ms"><b>${esc(p.n)}</b><span>${esc(p.name.trim()||'Jugador '+p.n)}</span><i>${esc(p.pos)}</i><em>${s.g?'⚽'.repeat(Math.min(s.g,3)):''}${s.y&&!s.r?'🟨':''}${s.r?'🟥':''}${s.out?'🔻':''}${s.in?'🔺':''}</em></div>`;};
 const st=list.filter(p=>p.st),bn=list.filter(p=>!p.st);
 return `<div class="lu${two?' two':''}" style="--c1:${T.c1};--c2:${T.c2}">
  <div class="lh">${lg(t,two?84:104)}<div><h1>${esc(T.name)}</h1><h3>${T.dt?'DT: '+esc(T.dt):''}${T.dt&&T.form?'   |   ':''}${T.form?esc(T.form):''}</h3></div></div>
  <div class="cols"><div><h4>TITULARES</h4>${st.map(row).join('')}</div>${two?'':`<div><h4>SUPLENTES</h4>${bn.map(row).join('')}</div>`}</div>
 </div>`;
}
function scMode(){return S.ui.scorerMode||(S.ui.scorers===false?'off':'timed');}
function scVis(){
 if(scMode()!=='timed')return '';
 const ms=(+S.ui.scorerSecs||12)*1000,now=Date.now(),man=(S.sShow||0)>now,d=derive();
 return ['A','B'].map(t=>d.goals[t].map(x=>(man||now-x.id<ms)?1:0).join('')).join('|');
}
function shortN(n){n=String(n||'').trim();if(n.length<=14)return n;const w=n.split(/\s+/);return w[w.length-1];}
function cdRem(){const c=S.cd;return Math.max(0,c.dur-(c.base+(c.running?Date.now()-c.t0:0)));}
function cdTxt(){const r=cdRem();return r<=0?'¡YA!':fmt(r,true);}
function pitchHTML(t,d){
 const T=S[t],all=T.players.map((p,i)=>({...p,i}));
 let list=all.filter(p=>p.name.trim());if(!list.length)list=all.slice(0,18);
 let st=list.filter(p=>p.st);if(!st.length)st=list.slice(0,11);
 const bn=list.filter(p=>!st.includes(p));
 const gi=st.findIndex(p=>/^(gk|por|po$|arq|p$)/i.test((p.pos||'').trim()));
 const gk=st[gi>=0?gi:0],rest=st.filter(p=>p!==gk);
 let f=String(T.form||'').split(/[^0-9]+/).map(Number).filter(n=>n>0);
 if(f.reduce((a,b)=>a+b,0)!==rest.length){const n=rest.length,a=Math.ceil(n/3),b=Math.ceil((n-a)/2);f=n?[a,b,Math.max(0,n-a-b)]:[];}
 const rows=[];let k=0;for(const c of f){if(c>0)rows.push(rest.slice(k,k+c));k+=c;}

 const l=libGet(),mk=Object.keys(l.matches).sort(),tk=Object.keys(l.teams).sort(),kb=Math.round(JSON.stringify(l).length/1024);
 const mrows=mk.length?mk.map((n,i)=>{const m=l.matches[n];return `<div class="ev"><span><b style="color:var(--tx);min-width:0">${esc(n)}</b><br><span class="mut">${fdate(m.ts)} · ${esc(m.data.A.name)} vs ${esc(m.data.B.name)}</span></span><button class="sm b" onclick="X.libLoadMatch(${i})">Cargar</button><button class="sm r" onclick="X.libDelMatch(${i})">✕</button></div>`;}).join(''):'<div class="mut">Aún no guardaste partidos.</div>';
 const trows=tk.length?tk.map((n,i)=>{const T=l.teams[n].data;return `<div class="ev">${T.logo?`<img src="${esc(T.logo)}" style="width:36px;height:36px;object-fit:contain">`:`<span style="width:36px;height:36px;border-radius:50%;background:${esc(T.c1)};display:inline-block"></span>`}<span><b style="color:var(--tx);min-width:0">${esc(n)}</b><br><span class="mut">${esc(T.short||'')} · ${(T.players||[]).filter(p=>p.name&&p.name.trim()).length} jugadores</span></span><button class="sm b" onclick="X.libLoadTeam('A',${i})">→ A</button><button class="sm b" onclick="X.libLoadTeam('B',${i})">→ B</button><button class="sm r" onclick="X.libDelTeam(${i})">✕</button></div>`;}).join(''):'<div class="mut">Aún no guardaste equipos.</div>';
 return `<div class="grid"><div class="card"><h3>Partidos guardados</h3>
 <div class="row"><input id="libname" style="flex:1" placeholder="${esc(S.A.name+' vs '+S.B.name)}"><button class="g" onclick="X.libSaveMatch()">💾 Guardar partido actual</button></div>
 <div class="log">${mrows}</div>
 <div class="row" style="margin-top:10px"><button class="r" onclick="X.resetMatch()">Nuevo partido (mantiene equipos)</button></div>
 <div class="mut">Se guarda todo: marcador, reloj, eventos, penales, estadísticas y auspiciadores.</div></div>
 <div class="card"><h3>Equipos guardados (plantillas)</h3>
 <div class="row"><button class="g" onclick="X.libSaveTeam('A')">💾 Guardar equipo A</button><button class="g" onclick="X.libSaveTeam('B')">💾 Guardar equipo B</button></div>
 <div class="log">${trows}</div>
 <div class="mut">Guarda nombre, escudo, colores, DT, esquema y jugadores. Cárgalo como equipo A o B cuando lo necesites.</div></div>
 <div class="card"><h3>Respaldo de la biblioteca</h3>
 <div class="row"><button onclick="X.libExport()">⬇ Descargar biblioteca</button><label>Cargar</label><input type="file" accept=".json" onchange="X.libImport(this)"></div>
 <div class="mut">Espacio usado: ${kb} KB. El navegador permite unos 5000 KB entre todo; si guardas muchos escudos grandes, descarga la biblioteca y borra lo que no uses.</div></div></div>`;
}
function setTab(){
 const base=location.href.split('#')[0];
 return `<div class="grid"><div class="card"><h3>Cómo conectar con OBS</h3><div class="help"><b>Vista previa y Pantalla:</b> la vista previa flotante es una copia en pequeño de la <b>Pantalla</b>. La Pantalla de verdad (la que usa OBS) es la dirección que termina en <b>#pantalla</b>, y debes abrir este archivo desde tu carpeta (doble clic), no desde una vista previa del chat.<br><br>
 <b>1.</b> Guarda este archivo en una carpeta fija (ejemplo: <b>C:\\Marcador\\marcador-futbol.html</b>).<br>
 <b>2.</b> En OBS: <b>Fuentes → + → Navegador</b>. Marca <b>Archivo local no</b> y en <b>URL</b> pega la dirección de pantalla (abajo). Tamaño: <b>1920 × 1080</b>.<br>
 <b>3.</b> Para controlar desde OBS: menú <b>Docks → Docks de navegador personalizados</b>, nombre «Marcador», URL = la dirección del panel (abajo). Así el panel y la pantalla comparten datos.<br>
 <b>4.</b> Si prefieres usar Chrome: abre la pantalla con <b>#verde</b>, y en OBS captura esa ventana con filtro «Clave de croma».</div>
 <div class="row"><label style="width:70px">Pantalla</label><input class="w" readonly value="${esc(base)}#pantalla" onclick="this.select()"></div>
 <div class="row"><label style="width:70px">Panel</label><input class="w" readonly value="${esc(base)}" onclick="this.select()"></div>
 <div class="row"><button onclick="X.open('pantalla')">Abrir pantalla (transparente)</button><button onclick="X.open('verde')">Abrir pantalla fondo verde</button></div></div>
 <div class="card"><h3>Respaldo y reinicio</h3>
 <div class="row"><button onclick="X.export()">⬇ Descargar respaldo</button><label>Cargar respaldo</label><input type="file" accept=".json" onchange="X.import(this)"></div>
 <div class="row"><button class="r" onclick="X.resetMatch()">Reiniciar partido (mantiene equipos)</button><button class="r" onclick="X.resetAll()">Borrar todo</button></div>
 <div class="help" style="margin-top:12px"><b>Atajo:</b> barra espaciadora = iniciar / pausar el reloj.<br>Todo se guarda solo en este navegador.</div></div></div>`;
}
const GROUPS=[
 {n:1,ic:'🛠',l:'Preparar',tabs:[['teams','Equipos'],['match','Partido y árbitros'],['spons','Auspiciadores'],['lib','Biblioteca']],hint:'Antes del partido: carga los equipos, los datos del partido y los auspiciadores. Guarda los equipos en la Biblioteca para reutilizarlos.'},
 {n:2,ic:'🎬',l:'Previa',tabs:[['prev','Gráficos de previa']],hint:'Antes del pitazo: revisa la lista, muestra presentación, alineaciones y árbitros, y pasa a En vivo.'},
 {n:3,ic:'⚽',l:'En vivo',tabs:[['live','Partido'],['stats','Estadísticas'],['pens','Penales']],hint:'Durante el partido: reloj y eventos a la mano. Barra espaciadora = iniciar o pausar.'},
 {n:4,ic:'🏁',l:'Final',tabs:[['end','Cierre del partido']],hint:'Al terminar: resultado final, estadísticas, agradecimiento y guardado.'},
 {n:0,ic:'🖥',l:'Pantalla',tabs:[['view','Ver pantalla'],['gfx','Marcador y banners'],['set','Ajustes / OBS']],hint:'Cómo se ve la pantalla: verla en grande, ajustar marcador y banners, y conectar con OBS.'}
];
function render(){
 const g=GROUPS.find(x=>x.tabs.some(t=>t[0]===TAB))||GROUPS[2];
 const body={live:liveTab,teams:teamsTab,match:matchTab,gfx:gfxTab,pens:pensTab,stats:statsTab,spons:sponsTab,lib:libTab,prev:prevTab,end:endTab,view:viewTab,set:setTab}[TAB]();
 const y=window.scrollY;
 document.getElementById('app').innerHTML=`<header class="top"><h1>⚽ Marcador</h1>
 <div class="grps">${GROUPS.map(x=>`<button class="grp ${x===g?'on':''}${x.n?'':' alt'}" onclick="X.tab('${x.tabs[0][0]}')">${x.n?`<span class="num">${x.n}</span>`:''}${x.ic} ${x.l}</button>`).join('')}</div>
 <nav class="sub">${g.tabs.length>1?g.tabs.map(t=>`<button class="tab ${TAB===t[0]?'on':''}" onclick="X.tab('${t[0]}')">${t[1]}</button>`).join(''):`<b style="color:var(--acc)">${g.tabs[0][1]}</b>`}<span class="hint">${g.hint}</span></nav></header><main>${INFO?`<div class="toast ok">✅ ${esc(INFO)}</div>`:''}${TOAST?`<div class="toast">⛔ ${esc(TOAST)}</div>`:''}${body}</main>`;
 if(ARM&&armed(ARM.k)){document.querySelectorAll('#app button').forEach(b=>{const o=b.getAttribute('onclick')||'';if(o.includes("'"+ARM.k+"'")&&!b.classList.contains('arm')){b.classList.add('arm');b.textContent='⚠ ¿Seguro? Clic otra vez';}});}
 const pvb=document.getElementById('pv');if(pvb)pvb.style.display=TAB==='view'?'none':'';
 if(TAB==='view'){const f=document.getElementById('bigf');f.addEventListener('load',pvPost);f.srcdoc=pvSrcdoc();bigFit();}
 window.scrollTo(0,y);
}
const PVK='mfutbol_pv';
let PV={x:null,y:null,w:420,min:innerWidth<900,bg:0};
try{Object.assign(PV,JSON.parse(localStorage.getItem(PVK))||{});}catch(e){}
function pvSave(){try{localStorage.setItem(PVK,JSON.stringify(PV));}catch(e){}}
let PVW=[];
function pvPost(){
 PVW=PVW.filter(w=>w&&!w.closed);const msg={mf:1,state:S};
 document.querySelectorAll('iframe.pvframe').forEach(f=>{try{f.contentWindow.postMessage(msg,'*');}catch(e){}});
 PVW.forEach(w=>{try{w.postMessage(msg,'*');}catch(e){}});
}
function pvApply(){
 const b=document.getElementById('pv');if(!b)return;
 const w=Math.max(240,Math.min(PV.w,innerWidth-16)),h=Math.round(w*9/16);
 b.style.width=w+'px';
 const x=PV.x==null?innerWidth-w-16:PV.x,y=PV.y==null?innerHeight-h-70:PV.y;
 b.style.left=Math.max(0,Math.min(x,innerWidth-90))+'px';
 b.style.top=Math.max(0,Math.min(y,innerHeight-34))+'px';
 b.classList.toggle('min',!!PV.min);b.dataset.bg=PV.bg;
 document.getElementById('pvv').style.height=h+'px';
 document.getElementById('pvf').style.transform='scale('+(w/1920)+')';
 const mb=b.querySelector('[data-a=min]');if(mb)mb.textContent=PV.min?'▢':'▁';
}
function pvSrcdoc(green){
 const js=document.getElementById('mainjs').textContent;
 return '<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">'+document.head.innerHTML+'</head><body><div id="app"></div><script>window.__DISP=1;'+(green?'window.__GREEN=1;':'')+js+'<\/script></body></html>';
}
function pvInit(){
 const d=document.createElement('div');d.id='pv';
 d.innerHTML='<div id="pvh"><b>📺 Vista previa</b><span class="sp"></span><button class="sm" data-a="bg" title="Cambiar fondo">🎨</button><button class="sm" data-a="mn" title="Más pequeña">−</button><button class="sm" data-a="pl" title="Más grande">+</button><button class="sm" data-a="min" title="Minimizar / mostrar">▁</button></div><div id="pvv"><iframe id="pvf" class="pvframe" title="Vista previa"></iframe></div>';
 document.body.appendChild(d);
 document.getElementById('pvf').srcdoc=pvSrcdoc();
 document.getElementById('pvf').addEventListener('load',pvPost);
 d.addEventListener('click',e=>{
  const a=e.target.dataset&&e.target.dataset.a;if(!a)return;
  if(a==='bg')PV.bg=(PV.bg+1)%3;
  else if(a==='mn')PV.w=Math.max(240,PV.w-80);
  else if(a==='pl')PV.w=Math.min(960,PV.w+80);
  else if(a==='min')PV.min=!PV.min;
  pvApply();pvSave();
 });
 const hd=document.getElementById('pvh');let drag=null;
 hd.addEventListener('pointerdown',e=>{if(e.target.dataset&&e.target.dataset.a)return;const r=d.getBoundingClientRect();drag={dx:e.clientX-r.left,dy:e.clientY-r.top};try{hd.setPointerCapture(e.pointerId);}catch(x){}});
 hd.addEventListener('pointermove',e=>{if(!drag)return;PV.x=e.clientX-drag.dx;PV.y=e.clientY-drag.dy;pvApply();});
 const end=()=>{if(drag){drag=null;pvSave();}};
 hd.addEventListener('pointerup',end);hd.addEventListener('pointercancel',end);
 addEventListener('resize',pvApply);
 pvApply();
}
function initPanel(){
 const per=S.clock.period,fresh=S.A.name==='Equipo A'&&S.B.name==='Equipo B'&&!S.events.length&&per===0;
 TAB=fresh?'teams':per===0?'prev':per===8?'pens':per===9?'end':'live';
 cdCheck();
 render();
 pvInit();
 setInterval(()=>{
  const c=document.getElementById('pclk');if(c){const ci=clockInfo();if(ci.has){c.textContent=ci.txt;const o=document.getElementById('pov');if(o)o.textContent=ci.over+' ';}}
  const b=document.getElementById('pbrk');if(b)b.textContent=fmt(brkRem(),true);
  cdCheck();
  const pc=document.getElementById('pcd');if(pc)pc.textContent=(S.cd.running||S.cd.base>0)?fmt(cdRem(),true):fmt((+S.cd.min||5)*60000,true);
 },200);
}
if(DISP)initDisplay();else initPanel();
</script>
</body>
</html>
